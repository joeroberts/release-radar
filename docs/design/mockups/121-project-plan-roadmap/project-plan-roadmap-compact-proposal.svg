<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="900" viewBox="0 0 1520 900" role="img" aria-labelledby="title desc">
  <title id="title">Proposed compact Project Plan roadmap and selected phase detail</title>
  <desc id="desc">Two compact window states show navigation from a scrollable roadmap to a dedicated selected-phase detail screen. Back restores the originating phase row and scroll position.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081522"/><stop offset="1" stop-color="#0d2434"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".3"/></filter>
    <style>
      .window { fill:url(#bg); stroke:#416078; stroke-width:2; }
      .bar { fill:#07111c; }
      .row { fill:#0c2130; stroke:#29485f; }
      .selected { fill:#123449; stroke:#50d8f0; stroke-width:2; }
      .button { fill:#123449; stroke:#3d708e; }
      .primary { fill:#17b8cf; }
      .chipBlue { fill:#103a52; stroke:#3694b5; }
      .chipAmber { fill:#4a3215; stroke:#d59a3a; }
      .chipGreen { fill:#123b32; stroke:#3aa985; }
      .chipGray { fill:#182a38; stroke:#4a6579; }
      .card { fill:#0a1a26; stroke:#233b4e; }
      .text { fill:#eaf3fa; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      .muted { fill:#9db1c1; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      .h1 { font-size:25px; font-weight:700; }
      .h2 { font-size:18px; font-weight:700; }
      .body { font-size:15px; }
      .small { font-size:13px; }
      .tiny { font-size:12px; }
      .label { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:14px; font-weight:650; }
      .rule { stroke:#254052; }
    </style>
  </defs>
  <rect width="1520" height="900" fill="#06101a"/>
  <text x="48" y="48" class="text h1">Compact navigation · roadmap remains the place to scan</text>
  <text x="48" y="76" class="muted body">Selecting a phase opens a dedicated detail screen. Back restores row, scroll position, and focus.</text>

  <!-- Roadmap window -->
  <rect x="48" y="108" width="676" height="740" rx="18" class="window" filter="url(#shadow)"/>
  <rect x="48" y="108" width="676" height="54" rx="18" class="bar"/>
  <circle cx="76" cy="135" r="6" fill="#f36b64"/><circle cx="96" cy="135" r="6" fill="#eab94f"/><circle cx="116" cy="135" r="6" fill="#4fc07a"/>
  <text x="386" y="140" text-anchor="middle" class="muted small">Signal Station — Project Plan</text>
  <text x="76" y="204" class="text h1">Roadmap</text>
  <rect x="456" y="176" width="112" height="36" rx="8" class="button"/><text x="512" y="199" text-anchor="middle" class="text small">Prepare plan</text>
  <rect x="580" y="176" width="116" height="36" rx="8" class="button"/><text x="638" y="199" text-anchor="middle" class="text small">All-phase board</text>

  <rect x="76" y="236" width="620" height="108" rx="11" class="card"/>
  <rect x="94" y="253" width="92" height="22" rx="11" class="chipGreen"/><text x="140" y="269" text-anchor="middle" class="text tiny">COMPLETED</text>
  <text x="94" y="303" class="text h2">1 · Foundation</text><text x="94" y="327" class="muted small">Ready · 12 / 12 tickets accepted</text>

  <rect x="76" y="358" width="620" height="136" rx="11" class="selected"/>
  <rect x="94" y="375" width="94" height="22" rx="11" class="chipBlue"/><text x="141" y="391" text-anchor="middle" class="text tiny">IN DELIVERY</text>
  <rect x="196" y="375" width="142" height="22" rx="11" class="chipAmber"/><text x="267" y="391" text-anchor="middle" class="text tiny">2 UNASSIGNED</text>
  <text x="94" y="428" class="text h2">2 · Planning</text><text x="94" y="453" class="text small">Draft · 8 / 10 tickets delivered</text>
  <text x="662" y="431" text-anchor="end" class="muted small">Next: Assign 2 tickets  ›</text>
  <rect x="94" y="468" width="450" height="7" rx="3.5" fill="#1d3546"/><rect x="94" y="468" width="360" height="7" rx="3.5" fill="#35cbe0"/>

  <rect x="76" y="508" width="620" height="126" rx="11" class="row"/>
  <rect x="94" y="525" width="80" height="22" rx="11" class="chipGray"/><text x="134" y="541" text-anchor="middle" class="text tiny">UPCOMING</text>
  <rect x="182" y="525" width="106" height="22" rx="11" class="chipAmber"/><text x="235" y="541" text-anchor="middle" class="text tiny">NEEDS GOAL</text>
  <text x="94" y="578" class="text h2">3 · Delivery</text><text x="94" y="603" class="muted small">Draft · 0 / 8 tickets delivered</text>
  <text x="662" y="579" text-anchor="end" class="muted small">Next: Create goal  ›</text>

  <rect x="76" y="648" width="620" height="94" rx="11" class="row"/>
  <text x="94" y="681" class="muted tiny">UNASSESSED</text><text x="94" y="714" class="text h2">4 · Release</text><text x="662" y="714" text-anchor="end" class="muted small">Legacy unassessed  ›</text>
  <text x="76" y="786" class="muted small">VoiceOver: “Planning, selected, In delivery phase, Draft plan…”</text>
  <text x="76" y="814" class="muted small">Return opens details · arrow keys move between phase rows</text>

  <!-- Direction -->
  <path d="M742 455h36" stroke="#50d8f0" stroke-width="3"/><path d="M771 447l10 8-10 8" fill="none" stroke="#50d8f0" stroke-width="3"/>
  <text x="760" y="490" text-anchor="middle" class="muted tiny">SELECT</text>

  <!-- Detail window -->
  <rect x="796" y="108" width="676" height="740" rx="18" class="window" filter="url(#shadow)"/>
  <rect x="796" y="108" width="676" height="54" rx="18" class="bar"/>
  <circle cx="824" cy="135" r="6" fill="#f36b64"/><circle cx="844" cy="135" r="6" fill="#eab94f"/><circle cx="864" cy="135" r="6" fill="#4fc07a"/>
  <text x="1134" y="140" text-anchor="middle" class="muted small">Signal Station — Planning</text>
  <rect x="824" y="178" width="136" height="36" rx="8" class="button"/>
  <path d="M846 196h14M846 196l7-7M846 196l7 7" fill="none" stroke="#dcecf6" stroke-width="2"/>
  <text x="906" y="201" text-anchor="middle" class="text small">Back to roadmap</text>
  <text x="824" y="253" class="muted tiny">SELECTED PHASE</text>
  <text x="824" y="288" class="text h1">Planning</text>
  <rect x="1330" y="259" width="114" height="28" rx="14" class="chipBlue"/><text x="1387" y="278" text-anchor="middle" class="text small">In delivery</text>
  <text x="824" y="318" class="text body">Draft plan · 8 of 10 delivered · 2 tickets unassigned.</text>
  <rect x="824" y="340" width="620" height="92" rx="10" fill="#3b2a16" stroke="#a9772d"/>
  <text x="844" y="367" class="text label" style="fill:#ffd88f;font-family:Helvetica,sans-serif">Next action</text>
  <text x="844" y="393" class="text body">Assign the 2 uncovered tickets before finalizing.</text>
  <rect x="1268" y="365" width="156" height="42" rx="9" class="primary"/><text x="1346" y="391" text-anchor="middle" class="text label" style="fill:#06131c;font-family:Helvetica,sans-serif">Edit assignments</text>

  <text x="824" y="475" class="text h2">Goals</text>
  <text x="824" y="500" class="muted body">2 goals · 8 of 10 tickets covered</text>
  <rect x="824" y="518" width="620" height="74" rx="9" class="card"/>
  <text x="844" y="547" class="text label">Make planning trustworthy</text><text x="1408" y="547" text-anchor="end" class="text label" style="fill:#77dfed;font-family:Helvetica,sans-serif">Edit</text>
  <text x="844" y="572" class="muted small">Done when readiness and recovery are explicit.</text>
  <rect x="824" y="606" width="166" height="36" rx="8" class="button"/><text x="907" y="629" text-anchor="middle" class="text label">Create Delivery Goal</text>

  <line x1="824" y1="667" x2="1444" y2="667" class="rule"/>
  <rect x="824" y="688" width="190" height="42" rx="8" class="button"/><text x="919" y="714" text-anchor="middle" class="text label">Open phase board</text>
  <rect x="1026" y="688" width="178" height="42" rx="8" class="button"/><text x="1115" y="714" text-anchor="middle" class="text label">View dependencies</text>
  <rect x="824" y="748" width="620" height="48" rx="8" class="card"/>
  <text x="844" y="778" class="text label">More details</text><text x="1408" y="778" text-anchor="end" class="muted body">Plan changes · Technical record  ›</text>
  <text x="824" y="824" class="muted small">Back restores focus to “Planning” at the same scroll position.</text>

  <text x="48" y="883" class="muted small">PROPOSAL · Synthetic content · Not a runtime capture · Compact layout &lt; 1100 pt</text>
</svg>
